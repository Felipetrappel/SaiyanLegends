name: Gerar APK (Android)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/android.yml']
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Montar projeto Capacitor
        run: |
          mkdir -p www
          cp -r index.html css js assets icons manifest.webmanifest sw.js www/
          npm init -y >/dev/null
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "Saiyan Legends" com.felipe.saiyanlegends --web-dir www
          npx cap add android
          npx cap sync android
      - name: Ajustar app (horizontal, tela cheia, ícone)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i -E 's#(android:name="[^"]*MainActivity")#\1 android:screenOrientation="sensorLandscape"#' $M
          S=android/app/src/main/res/values/styles.xml
          sed -i '/<style name="AppTheme.NoActionBar"/,/<\/style>/ s#</style>#<item name="android:windowFullscreen">true</item></style>#' $S
          R=android/app/src/main/res
          rm -rf $R/mipmap-anydpi-v26
          pip install pillow >/dev/null
          python3 - <<'PY'
          from PIL import Image
          im = Image.open('icons/icon-512.png').convert('RGBA')
          for n, sz in [('mdpi',48),('hdpi',72),('xhdpi',96),('xxhdpi',144),('xxxhdpi',192)]:
              for f in ['ic_launcher','ic_launcher_round','ic_launcher_foreground']:
                  im.resize((sz, sz), Image.LANCZOS).save(f'android/app/src/main/res/mipmap-{n}/{f}.png')
          PY
          grep -n "Orientation" $M; grep -n Fullscreen $S
      - name: Compilar APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: SaiyanLegends-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publicar na Release (download direto, sem login)
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk SaiyanLegends.apk
          gh release delete android-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create android-latest SaiyanLegends.apk --title "Saiyan Legends Online — Android (APK)" --notes "Baixe o SaiyanLegends.apk e instale. Se já tiver o app antigo, desinstale antes. O Android pode pedir para permitir instalar de fontes desconhecidas."
